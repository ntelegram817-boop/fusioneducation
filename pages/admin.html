<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Manager - Fusion Education BD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .image-preview {
            width: 100%;
            max-width: 300px;
            border-radius: 12px;
            margin-top: 0.5rem;
            box-shadow: var(--shadow-md);
            border: 2px dashed var(--border-light);
            padding: 1rem;
            text-align: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
        }
        .gallery-items {
            display: grid;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .gallery-item-card {
            background: var(--white);
            border: 2px solid var(--border-light);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
        }
        .gallery-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .gallery-item-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
        }
        .delete-btn {
            background: var(--error);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition-base);
        }
        .delete-btn:hover {
            background: #d03030;
            transform: scale(1.05);
        }
        .edit-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 0.5rem;
            transition: all var(--transition-base);
        }
        .edit-btn:hover {
            background: #2563eb;
            transform: scale(1.05);
        }
        .tab-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--border-light);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition-base);
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .success-message {
            background: var(--success);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        window.location.href = 'admin-login.html';
    </script>
    <!-- Header/Navigation -->
    <header>
        <div class="container">
            <nav>
                <a href="../index.html" class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    Fusion <span>Education</span>
                </a>
                <ul class="nav-menu">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
                <div class="nav-actions">
                    <a href="../index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
                </div>
            </nav>
        </div>
    </header>

    <section class="section" style="background: var(--background-light); min-height: 100vh;">
        <div class="admin-container">
            <div class="admin-header">
                <div>
                    <h1>Gallery Manager</h1>
                    <p style="color: var(--text-secondary); margin-top: 0.5rem;">Add, edit, and manage your gallery items with photos and text</p>
                </div>
                <a href="../index.html" class="btn btn-primary"><i class="fas fa-home"></i> View Gallery</a>
            </div>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check"></i> Changes saved successfully!
            </div>

            <!-- Tab Navigation -->
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('add')">
                    <i class="fas fa-plus"></i> Add New Item
                </button>
                <button class="tab-btn" onclick="switchTab('manage')">
                    <i class="fas fa-list"></i> Manage Items
                </button>
            </div>

            <!-- Add New Item Tab -->
            <div id="add-tab" class="tab-content active">
                <div class="card" style="background: white; padding: 2rem;">
                    <h2 style="margin-bottom: 1.5rem;">Add New Gallery Item</h2>
                    <form id="addItemForm" onsubmit="handleAddItem(event)">
                        <div class="form-group">
                            <label for="itemTitle"><i class="fas fa-heading"></i> Title (শিরোনাম)</label>
                            <input type="text" id="itemTitle" placeholder="e.g., Student Success Story" required>
                        </div>

                        <div class="form-group">
                            <label for="itemText"><i class="fas fa-align-left"></i> Description Text</label>
                            <textarea id="itemText" placeholder="বাংলায় লিখুন আপনার বর্ণনা..." required></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="itemPhotoSize"><i class="fas fa-image"></i> Photo Size</label>
                                <select id="itemPhotoSize" required>
                                    <option value="small">Small (250px)</option>
                                    <option value="medium" selected>Medium (350px)</option>
                                    <option value="large">Large (450px)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="itemLayout"><i class="fas fa-th-large"></i> Layout Style</label>
                                <select id="itemLayout" required>
                                    <option value="horizontal">Horizontal (Photo Left, Text Right)</option>
                                    <option value="vertical">Vertical (Photo Top, Text Bottom)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="itemImage"><i class="fas fa-upload"></i> Upload Photo</label>
                            <input type="file" id="itemImage" accept="image/*" onchange="previewImage(event, 'addPreview')" required>
                            <div id="addPreview" class="image-preview"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1.5rem;">
                            <i class="fas fa-save"></i> Add to Gallery
                        </button>
                    </form>
                </div>
            </div>

            <!-- Manage Items Tab -->
            <div id="manage-tab" class="tab-content">
                <div id="itemsList" class="gallery-items">
                    <!-- Items will be loaded here -->
                </div>
                <div id="emptyState" style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                    <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>
                    <p>কোন আইটেম নেই। নতুন আইটেম যোগ করুন।</p>
                </div>
            </div>
        </div>
    </section>

    <script src="../assets/js/gallery.js"></script>
    <script>
        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'manage') {
                loadItemsList();
            }
        }

        // Preview image
        function previewImage(event, previewId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById(previewId);
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Handle adding new item
        function handleAddItem(event) {
            event.preventDefault();
            
            const title = document.getElementById('itemTitle').value;
            const text = document.getElementById('itemText').value;
            const file = document.getElementById('itemImage').files[0];
            
            // Validation
            if (!title || !text || !file) {
                showSuccess('দয়া করে সব ফিল্ড পূরণ করুন!');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const item = {
                        title: title,
                        text: text,
                        image: e.target.result,
                        photoSize: document.getElementById('itemPhotoSize').value,
                        layout: document.getElementById('itemLayout').value
                    };

                    const result = addGalleryItem(item);
                    console.log('Item added:', result);
                    
                    // Reset form
                    document.getElementById('addItemForm').reset();
                    document.getElementById('addPreview').innerHTML = '';
                    
                    // Show success message
                    showSuccess('আইটেম সফলভাবে যোগ হয়েছে!');
                } catch (error) {
                    console.error('Error adding item:', error);
                    showSuccess('ত্রুটি: ' + error.message);
                }
            };
            
            reader.onerror = () => {
                console.error('File reading error');
                showSuccess('ফাইল পড়তে ত্রুটি!');
            };
            
            reader.readAsDataURL(file);
        }

        // Load items for management
        function loadItemsList() {
            const items = getGalleryItems();
            const itemsList = document.getElementById('itemsList');
            const emptyState = document.getElementById('emptyState');

            if (items.length === 0) {
                itemsList.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            itemsList.innerHTML = items.map(item => `
                <div class="gallery-item-card">
                    <div class="gallery-item-header">
                        <div>
                            <div class="gallery-item-title">${item.title}</div>
                            <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.9rem;">
                                <i class="fas fa-layout-${item.layout === 'horizontal' ? 'left' : 'top'}"></i> ${item.layout === 'horizontal' ? 'Horizontal Layout' : 'Vertical Layout'} • 
                                <i class="fas fa-image"></i> ${item.photoSize}
                            </p>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="delete-btn">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                    <div style="display: grid; grid-template-columns: 200px 1fr; gap: 1rem; margin-top: 1rem;">
                        <div>
                            <img src="${item.image}" alt="${item.title}" style="width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover;">
                        </div>
                        <div>
                            <p style="color: var(--text-secondary); line-height: 1.6;">${item.text}</p>
                            <button onclick="editItem(${item.id})" class="edit-btn" style="margin-top: 1rem;">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Delete item
        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                deleteGalleryItem(id);
                loadItemsList();
                renderGallery('gallery-container');
                showSuccess('Item deleted successfully!');
            }
        }

        // Show success message
        function showSuccess(message) {
            const msg = document.getElementById('successMessage');
            msg.innerHTML = `<i class="fas fa-check"></i> ${message}`;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // Edit item (simple update via dialog)
        function editItem(id) {
            const items = getGalleryItems();
            const item = items.find(i => i.id === id);
            if (!item) return;

            const newTitle = prompt('Edit Title:', item.title);
            if (newTitle) {
                const newText = prompt('Edit Description:', item.text);
                if (newText) {
                    updateGalleryItem(id, { title: newTitle, text: newText });
                    loadItemsList();
                    renderGallery('gallery-container');
                    showSuccess('Item updated successfully!');
                }
            }
        }

        // Load items on page load
        document.addEventListener('DOMContentLoaded', loadItemsList);
    </script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <!-- Firebase Configuration -->
    <script src="../assets/js/firebase-config.js"></script>
</body>
</html>
