<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login | Fusion Education</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0b1020 0%, #1f2937 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .login-shell {
      width: min(520px, 100%);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 24px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.35);
      padding: 2rem;
    }

    .login-shell h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 4vw, 2.5rem);
    }

    .login-shell p {
      margin: 0 0 2rem;
      color: #94a3b8;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      font-size: 1rem;
      padding: 0.95rem 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .login-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
    }

    .btn-primary,
    .btn-secondary {
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      padding: 0.95rem 1.5rem;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      background: #1d4ed8;
    }

    .btn-secondary {
      background: transparent;
      color: #94a3b8;
      padding: 0.95rem 1.5rem;
      border: 1px solid rgba(148, 163, 184, 0.32);
    }

    .btn-secondary:hover {
      transform: translateY(-1px);
      border-color: rgba(37, 99, 235, 0.45);
    }

    .alert {
      margin-top: 1rem;
      padding: 1rem 1.25rem;
      border-radius: 14px;
      font-size: 0.95rem;
      display: none;
    }

    .alert--error {
      background: rgba(248, 113, 113, 0.16);
      color: #fecaca;
    }

    .alert--success {
      background: rgba(134, 239, 172, 0.16);
      color: #bbf7d0;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <h1>Staff Login</h1>
    <p>Sign in with your staff credentials and choose your active branch to view students for that location only.</p>

    <form id="staffLoginForm">
      <div class="form-group">
        <label for="staffEmail">Email</label>
        <input id="staffEmail" type="email" autocomplete="username" required placeholder="staff@fusioneducation.com" />
      </div>

      <div class="form-group">
        <label for="staffPassword">Password</label>
        <input id="staffPassword" type="password" autocomplete="current-password" required placeholder="Enter your password" />
      </div>

      <div class="form-group">
        <label for="staffBranch">Branch</label>
        <select id="staffBranch" required>
          <option value="">Select branch</option>
          <option value="Dinajpur">Dinajpur</option>
          <option value="Bogura">Bogura</option>
        </select>
      </div>

      <button class="btn-primary" type="submit"><i class="fas fa-sign-in-alt"></i> Continue to Dashboard</button>
    </form>

    <div id="loginAlert" class="alert alert--error"></div>

    <div class="login-actions">
      <button class="btn-secondary" type="button" onclick="window.location.href='../index.html'">Back to Home</button>
      <p style="color: #94a3b8; margin: 0;">Contact admin if you need account access.</p>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById('staffLoginForm');
    const loginAlert = document.getElementById('loginAlert');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginAlert.style.display = 'none';

      const payload = {
        email: document.getElementById('staffEmail').value.trim(),
        password: document.getElementById('staffPassword').value,
        branch: document.getElementById('staffBranch').value
      };

      try {
        const response = await fetch('/api/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          loginAlert.textContent = result.error || 'Login failed. Check your credentials and branch.';
          loginAlert.style.display = 'block';
          return;
        }

        window.location.href = result.redirect || '/pages/staff-dashboard.html';
      } catch (error) {
        loginAlert.textContent = 'Unable to contact server. Please try again later.';
        loginAlert.style.display = 'block';
      }
    });
  </script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <!-- Firebase Configuration -->
    <script src="../assets/js/firebase-config.js"></script>
</body>
</html>
