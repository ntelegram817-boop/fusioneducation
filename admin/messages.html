<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Inbox — Fusion Education BD Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="topbar-inner">
            <a href="../index.html" class="logo">
                <img src="../assets/images/logo.jpg" alt="Fusion Logo">
                Fusion <span>Education</span>
                <span class="logo-badge">Admin</span>
            </a>
            <div class="topbar-right">
                <a href="../index.html" class="topbar-btn outline" target="_blank">
                    <i class="fas fa-external-link-alt"></i> View Site
                </a>
                <a href="../pages/admin-login.html" class="topbar-btn danger" onclick="logoutAdmin(event)">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </header>

    <!-- NAV RAIL -->
    <div class="nav-rail-container">
        <nav class="nav-rail" aria-label="Admin Navigation">
            <a href="dashboard.html" class="nav-pill"><i class="fas fa-sliders-h"></i> Site Settings</a>
            <a href="posts.html" class="nav-pill"><i class="fas fa-newspaper"></i> Home Posts</a>
            <a href="courses.html" class="nav-pill"><i class="fas fa-book-open"></i> Courses</a>
            <a href="testimonials.html" class="nav-pill"><i class="fas fa-user-check"></i> Testimonials</a>
            <a href="faqs.html" class="nav-pill"><i class="fas fa-question-circle"></i> FAQs</a>
            <a href="messages.html" class="nav-pill active"><i class="fas fa-envelope"></i> Messages <span class="badge" id="navMsgCount">0</span></a>
            <a href="admissions.html?tab=pending" class="nav-pill"><i class="fas fa-user-clock"></i> Admission Pending <span class="badge" id="navPendingCount">0</span></a>
            <a href="admissions.html?tab=admitted" class="nav-pill"><i class="fas fa-user-check"></i> Admitted Students <span class="badge" id="navAdmittedCount">0</span></a>
            <a href="users.html" class="nav-pill"><i class="fas fa-user-shield"></i> Admin User</a>
        </nav>
    </div>

    <!-- MAIN -->
    <main class="shell">
        <div class="page-header">
            <div class="page-title-block">
                <h1>
                    <span class="icon-wrap"><i class="fas fa-envelope"></i></span>
                    Contact Inquiries & Messages
                </h1>
                <p>Read, respond to, and manage leads sent from the website contact page.</p>
            </div>
        </div>

        <div class="layout-single">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-inbox"></i> Inbox Messages
                    </div>
                    <span class="count-badge" id="messagesCountBadge">
                        <i class="fas fa-envelope"></i> 0 messages
                    </span>
                </div>
                <div class="card-body">
                    <div class="items-list" id="messagesList">
                        <div class="skeleton skeleton-card"></div>
                        <div class="skeleton skeleton-card"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../assets/js/dao.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
